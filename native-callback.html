<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<title>Signing you in…</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0F1115; color: #E8E6E1; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  h1 { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 22px; margin: 0 0 8px; color: #D4AF37; }
  p { margin: 4px 0; font-size: 14px; opacity: 0.85; }
  pre { margin-top: 16px; max-width: 100%; white-space: pre-wrap; word-break: break-all; font-size: 11px; opacity: 0.6; text-align: left; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Signing you in…</h1>
  <p>Returning to the app.</p>
  <pre id="diag"></pre>
</div>
<script>
/**
 * EverReed native OAuth shim — runs on auth.everreed.app (NOT App-Linked,
 * NOT canonical-redirected). Converts Supabase implicit-flow URL fragment
 * (#access_token=...&refresh_token=...) into a custom-scheme deeplink
 * (everreed://oauth/auth?access_token=...&refresh_token=...) that Despia
 * routes into the app's WebView at /auth.
 *
 * Do NOT host this on everreed.app (Android App Links hijack) or
 * everreed.lovable.app (canonical 302 redirects to everreed.app).
 */
(function () {
  var diag = document.getElementById('diag');
  function log(msg) {
    try { console.log('[NativeCallbackHTML]', msg); } catch (_) {}
    if (diag) diag.textContent += msg + '\n';
  }

  log('href=' + window.location.href);

  var params = new URLSearchParams(window.location.search);
  var scheme = params.get('deeplink_scheme');
  if (!scheme) {
    log('ERROR: no deeplink_scheme param');
    return;
  }
  log('scheme=' + scheme);

  var hash  = new URLSearchParams(window.location.hash.substring(1));
  var accessToken  = hash.get('access_token')  || params.get('access_token');
  var refreshToken = hash.get('refresh_token') || params.get('refresh_token') || '';
  var error = hash.get('error') || params.get('error');
  var code  = params.get('code');

  log('has_token=' + !!accessToken + ' has_refresh=' + !!refreshToken + ' has_code=' + !!code + ' has_error=' + !!error);

  // Despia control prefix: `<scheme>://oauth/auth?...` tells Despia to close
  // the secure browser session and navigate the WebView to `/auth?...`.
  var deeplinkPath = 'oauth/auth';
  var deeplinkQueryKeys;
  var deeplink;
  if (accessToken) {
    deeplinkQueryKeys = 'access_token,refresh_token';
    deeplink = scheme + '://' + deeplinkPath +
      '?access_token='  + encodeURIComponent(accessToken) +
      '&refresh_token=' + encodeURIComponent(refreshToken);
  } else if (code) {
    deeplinkQueryKeys = 'code';
    deeplink = scheme + '://' + deeplinkPath + '?code=' + encodeURIComponent(code);
  } else if (error) {
    deeplinkQueryKeys = 'error';
    deeplink = scheme + '://' + deeplinkPath + '?error=' + encodeURIComponent(error);
  } else {
    deeplinkQueryKeys = 'error';
    deeplink = scheme + '://' + deeplinkPath + '?error=no_token_or_code';
  }
  log('firing scheme=' + scheme + ' path=' + deeplinkPath + ' query_keys=' + deeplinkQueryKeys);

  // Token-safe diagnostic beacon. NEVER includes token/code values.
  try {
    var searchKeys = [];
    params.forEach(function (_v, k) { searchKeys.push(k); });
    var hashKeys = [];
    hash.forEach(function (_v, k) { hashKeys.push(k); });
    var probeBody = JSON.stringify({
      stage: 'pre_deeplink',
      source: 'auth.everreed.app/native-callback.html',
      host: window.location.host,
      pathname: window.location.pathname,
      scheme: scheme,
      deeplink_path: deeplinkPath,
      search_keys: searchKeys.sort().join(',') || '(none)',
      hash_keys: hashKeys.sort().join(',') || '(none)',
      has_access_token: !!accessToken,
      has_refresh_token: !!refreshToken,
      has_code: !!code,
      has_error: !!error
    });
    var probeUrl = 'https://lhzyjpbunwctxxnjniyi.supabase.co/functions/v1/auth-callback-probe';
    var sent = false;
    if (navigator.sendBeacon) {
      try {
        sent = navigator.sendBeacon(probeUrl, new Blob([probeBody], { type: 'application/json' }));
        log('probe sendBeacon=' + sent);
      } catch (e) { log('probe sendBeacon threw: ' + (e && e.message ? e.message : String(e))); }
    }
    if (!sent) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', probeUrl, false);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(probeBody);
        log('probe xhr status=' + xhr.status);
      } catch (e) { log('probe xhr threw: ' + (e && e.message ? e.message : String(e))); }
    }
  } catch (e) { log('probe outer threw: ' + (e && e.message ? e.message : String(e))); }

  // Fire the custom-scheme deeplink. Chrome Custom Tabs / ASWebAuthenticationSession
  // hands off to the app on this scheme and closes the browser tab.
  window.location.href = deeplink;

  // Watchdog only — do NOT redirect to everreed.app or everreed.lovable.app,
  // either would re-introduce the App Link / canonical-redirect failure modes.
  setTimeout(function () {
    log('deeplink not consumed after 1500ms — app may not have registered scheme');
  }, 1500);
  setTimeout(function () {
    log('still here 6s after start — deeplink not consumed');
  }, 6000);
})();
</script>
</body>
</html>
