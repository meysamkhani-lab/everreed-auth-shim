<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="referrer" content="no-referrer" />
<meta name="robots" content="noindex,nofollow" />
<title>Signing you in…</title>
<style>
  :root {
    --bg: #F4F6F8;
    --surface: #FFFFFF;
    --ink: #0F1115;
    --muted: #6B6F76;
    --gold: #A98B57;
  }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
  .brand { font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 28px; letter-spacing: 0.2px; color: var(--gold); margin: 0 0 18px; }
  .title { font-size: 15px; font-weight: 500; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--muted); margin: 0; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 2px solid rgba(15,17,21,0.12); border-top-color: var(--gold); animation: spin 0.9s linear infinite; margin: 0 0 18px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .return-btn { display: none; margin-top: 22px; padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(15,17,21,0.12); background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 500; cursor: pointer; box-shadow: 0 1px 2px rgba(15,17,21,0.04); }
  .return-btn:hover { background: #FAFBFC; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0F1115; --surface: #181D24; --ink: #E8E6E1; --muted: #9AA0A6; }
    .return-btn { border-color: rgba(232,230,225,0.14); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="spinner" aria-hidden="true"></div>
  <h1 class="brand">EverReed</h1>
  <p class="title">Signing you in…</p>
  <p class="sub">Returning to the app…</p>
  <button id="returnBtn" class="return-btn" type="button">Return to EverReed</button>
</div>
<script>
(function () {
  // SECURITY: never render or log any URL, hash, query, deep link, or token values.
  // All diagnostic output is reduced to value-free booleans.

  var params = new URLSearchParams(window.location.search);
  var scheme = params.get('deeplink_scheme');
  if (!scheme) {
    try { console.warn('[NativeCallback] missing deeplink_scheme'); } catch (_) {}
    return;
  }

  var hash  = new URLSearchParams(window.location.hash.substring(1));
  var accessToken  = hash.get('access_token')  || params.get('access_token');
  var refreshToken = hash.get('refresh_token') || params.get('refresh_token') || '';
  var error = hash.get('error') || params.get('error');
  var code  = params.get('code');

  var deeplinkPath = 'oauth/auth';
  var deeplink;
  if (accessToken) {
    deeplink = scheme + '://' + deeplinkPath +
      '?access_token='  + encodeURIComponent(accessToken) +
      '&refresh_token=' + encodeURIComponent(refreshToken);
  } else if (code) {
    deeplink = scheme + '://' + deeplinkPath + '?code=' + encodeURIComponent(code);
  } else if (error) {
    // error string may be a generic code like "access_denied" — still pass through but never render
    deeplink = scheme + '://' + deeplinkPath + '?error=' + encodeURIComponent(error);
  } else {
    deeplink = scheme + '://' + deeplinkPath + '?error=no_token_or_code';
  }

  // Token-safe probe beacon: sends booleans + key counts only, never values.
  try {
    var searchKeyCount = 0;
    params.forEach(function () { searchKeyCount++; });
    var hashKeyCount = 0;
    hash.forEach(function () { hashKeyCount++; });
    var probeBody = JSON.stringify({
      stage: 'pre_deeplink',
      source: 'native-callback.html',
      host: window.location.host,
      pathname: window.location.pathname,
      deeplink_path: deeplinkPath,
      search_key_count: searchKeyCount,
      hash_key_count: hashKeyCount,
      has_access_token: !!accessToken,
      has_refresh_token: !!refreshToken,
      has_code: !!code,
      has_error: !!error
    });
    var probeUrl = 'https://lhzyjpbunwctxxnjniyi.supabase.co/functions/v1/auth-callback-probe';
    var sent = false;
    if (navigator.sendBeacon) {
      try {
        sent = navigator.sendBeacon(probeUrl, new Blob([probeBody], { type: 'application/json' }));
      } catch (_) {}
    }
    if (!sent) {
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', probeUrl, false);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(probeBody);
      } catch (_) {}
    }
  } catch (_) {}

  // Fire deeplink. External browser (Custom Tabs / ASWebAuthSession) hands off to native app.
  try { window.location.href = deeplink; } catch (_) {}

  // Fallback for in-WebView load: navigate to in-app callback route.
  setTimeout(function () {
    try {
      var path = '/oauth/auth' + (accessToken
        ? ('?access_token=' + encodeURIComponent(accessToken) + '&refresh_token=' + encodeURIComponent(refreshToken))
        : code ? ('?code=' + encodeURIComponent(code))
        : error ? ('?error=' + encodeURIComponent(error))
        : '?error=no_token_or_code');
      if (/(^|\.)lovable\.app$/.test(window.location.hostname)) {
        window.location.replace('https://everreed.app' + path);
      } else {
        window.location.replace(path);
      }
    } catch (_) {}
  }, 1500);

  // After ~4s, surface the manual return button (no visible href, no token text).
  setTimeout(function () {
    var btn = document.getElementById('returnBtn');
    if (!btn) return;
    btn.style.display = 'inline-block';
    btn.addEventListener('click', function () {
      try { window.location.href = deeplink; } catch (_) {}
    });
  }, 4000);
})();
</script>
</body>
</html>
